<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>RepairSync</title>
    <meta name="application-name" content="RepairSync" />
    <meta property="og:title" content="RepairSync" />
    <meta property="og:site_name" content="RepairSync" />
    <meta
      name="description"
      content="RepairSync is a repair business management app for repair tickets, customer communication, invoicing, quotes, inventory, technician workflows, and repair shop operations."
    />
    <script>
      (function () {
        var recoveryKey = "repairsync.assetRecoveryAttempted";
        var fallbackTimer = window.setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.children.length === 0) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:24px;text-align:center;">' +
              '<div><div style="height:34px;width:34px;border:4px solid #e4e4e7;border-top-color:#18181b;border-radius:999px;margin:0 auto 14px;animation:repairSyncSpin 1s linear infinite;"></div>' +
              '<div style="font-weight:700;margin-bottom:12px;">Updating RepairSync...</div>' +
              '<button id="repairsync-reload-button" type="button" style="border:1px solid #d4d4d8;background:white;border-radius:12px;padding:10px 14px;font-weight:700;">Reload RepairSync</button></div></div>' +
              '<style>@keyframes repairSyncSpin{to{transform:rotate(360deg)}}</style>';
            var reloadButton = document.getElementById("repairsync-reload-button");
            if (reloadButton) {
              reloadButton.addEventListener("click", function () {
                window.location.replace("/?refresh=" + Date.now());
              });
            }
          }
        }, 8000);

        window.__repairSyncAppMounted = function () {
          window.clearTimeout(fallbackTimer);
          try {
            window.sessionStorage.removeItem(recoveryKey);
          } catch (_) {}
        };

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            var isAsset =
              target &&
              (target.tagName === "SCRIPT" || target.tagName === "LINK") &&
              typeof target.src === "string"
                ? target.src.indexOf("/assets/") !== -1
                : typeof target.href === "string" && target.href.indexOf("/assets/") !== -1;

            if (!isAsset) return;

            try {
              if (window.sessionStorage.getItem(recoveryKey) === "1") return;
              window.sessionStorage.setItem(recoveryKey, "1");
            } catch (_) {}

            window.location.replace("/?refresh=" + Date.now());
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <template id="repairsync-branding">
      <main>
        <h1>RepairSync</h1>
        <h2>Repair business management app</h2>
        <p>
          RepairSync helps repair businesses manage repair tickets, customer communication,
          invoicing, quotes, inventory, technician workflows, and automated repair shop
          operations from one secure app.
        </p>
        <p>
          <a href="/privacy-policy">Privacy Policy</a>
          <a href="/terms">Terms of Service</a>
        </p>
      </main>
    </template>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
